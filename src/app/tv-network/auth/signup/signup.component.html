<mat-horizontal-stepper [linear]="true" #stepper>
    <!-- Step 1: Personal Info -->
    <mat-step [stepControl]="personalInfoForm">
      <form [formGroup]="personalInfoForm">
        <ng-template matStepLabel>Personal Info</ng-template>
  
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required>
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required>
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required>
        </mat-form-field>
  
        <div>
          <button mat-button matStepperNext [disabled]="personalInfoForm.invalid">Next</button>
        </div>
      </form>
    </mat-step>
  
    <!-- Step 2: Additional Info -->
    <mat-step [stepControl]="additionalInfoForm">
      <form [formGroup]="additionalInfoForm">
        <ng-template matStepLabel>Additional Info</ng-template>
  
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Gender</mat-label>
          <mat-select formControlName="gender" required>
            <mat-option value="male">Male</mat-option>
            <mat-option value="female">Female</mat-option>
            <mat-option value="other">Other</mat-option>
          </mat-select>
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Date of Birth</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dob" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Country</mat-label>
          <mat-select formControlName="country" required>
            <mat-option *ngFor="let c of countries" [value]="c">{{ c }}</mat-option>
          </mat-select>
        </mat-form-field>
  
        <div>
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button matStepperNext [disabled]="additionalInfoForm.invalid">Next</button>
        </div>
      </form>
    </mat-step>
  
    <!-- Step 3: Interests -->
    <mat-step [stepControl]="interestsForm">
      <form [formGroup]="interestsForm">
        <ng-template matStepLabel>Choose Interests</ng-template>
  
        <mat-chip-listbox aria-label="Interests">
          <mat-chip *ngFor="let interest of interestsList"
                    selectable="true"
                    [selected]="selectedInterests.includes(interest)"
                    (click)="toggleInterest(interest)"
                    [color]="selectedInterests.includes(interest) ? 'primary' : undefined"
                    [selected]="selectedInterests.includes(interest)">
            {{ interest }}
          </mat-chip>
        </mat-chip-listbox>
  
        <div class="mt-3">
          <button mat-button matStepperPrevious>Back</button>
          <button mat-raised-button color="primary" type="button"
                  [disabled]="interestsForm.invalid || isSubmitting"
                  (click)="submit()">
            {{ isSubmitting ? 'Submitting...' : 'Sign Up' }}
          </button>
        </div>
      </form>
    </mat-step>
  </mat-horizontal-stepper>
