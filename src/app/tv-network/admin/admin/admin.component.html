<div class="tag-manager-container mat-elevation-z4">
    <mat-card>
      <mat-card-title>Add Tags</mat-card-title>
      <mat-card-content>
        <form [formGroup]="tagForm" (ngSubmit)="addTag()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tag Name</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Type</mat-label>
            <mat-select formControlName="type">
              <mat-option value="show">Show</mat-option>
              <mat-option value="episode">Episode</mat-option>
              <mat-option value="media">Media</mat-option>
            </mat-select>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description"></textarea>
          </mat-form-field>
  
          <button mat-raised-button color="primary" type="submit" [disabled]="tagForm.invalid">Add Tag</button>
        </form>
      </mat-card-content>
    </mat-card>
  
    <mat-divider class="my-4"></mat-divider>
  
    <mat-card>
      <mat-card-title>Bulk Upload Tags (JSON)</mat-card-title>
      <mat-card-content>
        <textarea
          matInput
          [(ngModel)]="jsonInput"
          placeholder='Paste JSON array of tags here'
          rows="6"
          class="json-textarea"
        ></textarea>
        <br />
        <button mat-stroked-button color="accent" (click)="uploadTagsFromJson()">Upload JSON</button>
      </mat-card-content>
    </mat-card>
  
    <mat-divider class="my-4"></mat-divider>
  
    <mat-card>
      <mat-card-title>Existing Tags</mat-card-title>
      <mat-card-content>
        <mat-list>
          <mat-list-item *ngFor="let tag of tags; let i = index">
            <span>{{ i + 1 }}.</span> <strong>{{ tag.name }}</strong> - <em>{{ tag.type }}</em> <span class="desc">{{ tag.description }}</span>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>
  </div>
