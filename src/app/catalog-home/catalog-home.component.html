
<div class="page">

    <!-- HERO -->
    <section class="hero" *ngIf="hero">
      <img class="hero-bg" [src]="backdropUrl(hero)" alt="" />
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>{{ hero.name }}</h1>
        <p class="synopsis">{{ hero.synopsis }}</p>
        <div class="meta">
          <span *ngIf="hero.year">{{ hero.year }}</span>
          <span *ngIf="hero.rating">• {{ hero.rating }}</span>
          <span *ngIf="hero.genres?.length">• {{ hero.genres.slice(0,2).join(", ") }}</span>
        </div>
        <div class="hero-actions">
          <button class="btn primary">Play</button>
          <button class="btn">More Info</button>
        </div>
      </div>
    </section>
  
    <!-- SIGN IN FOR CONTINUE WATCHING -->
    <div class="signin-tip" *ngIf="!userEmail">
      <span>Sign in to see Continue Watching</span>
      <button class="btn small" (click)="signIn()">Sign in with Google</button>
    </div>
  
    <!-- RAILS -->
    <ng-container *ngFor="let section of rails">
      <section class="rail" *ngIf="section.items.length; else emptyRail">
        <div class="rail-head">
          <h2>{{ section.rail.title }}</h2>
          <div class="spacer"></div>
          <div class="rail-ctrl">
            <button class="nav" (click)="scrollLeft(scroller)">‹</button>
            <button class="nav" (click)="scrollRight(scroller)">›</button>
          </div>
        </div>
  
        <div #scroller class="cards" tabindex="0">
          <article class="card" *ngFor="let t of section.items">
            <img
              [src]="posterUrl(t)"
              [alt]="t.name"
              loading="lazy"
              referrerpolicy="no-referrer"
            />
            <div class="card-meta">
              <h3>{{ t.name }}</h3>
              <div class="sub">
                <span *ngIf="t.year">{{ t.year }}</span>
                <span *ngIf="t.rating">• {{ t.rating }}</span>
              </div>
              <!-- <div class="progress" *ngIf="(t as any)._progress">
                <div class="bar" [style.width.%]="(t as any)._progress"></div>
              </div> -->
            </div>
          </article>
  
          <!-- skeletons while loading -->
          <article class="card skeleton" *ngIf="loading" aria-hidden="true" ></article>
          <article class="card skeleton" *ngIf="loading" aria-hidden="true" ></article>
          <article class="card skeleton" *ngIf="loading" aria-hidden="true" ></article>
        </div>
      </section>
  
      <ng-template #emptyRail></ng-template>
    </ng-container>
  
    <div class="pad"></div>
  </div>
